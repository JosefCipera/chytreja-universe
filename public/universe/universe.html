<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesmír Desktop 🌌</title>

    <!-- 📦 Knihovny -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- 🎨 Styly -->
    <link rel="stylesheet" href="../assets/css/universe-core.css">
    <link rel="stylesheet" href="../assets/css/universe-header.css">

    <!-- 🔧 Panel (musí být před init) -->
    <script type="module" src="../assets/js/universe-panel.js"></script>

    <!-- 🧱 Manifest -->
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#101c35">

    <!-- 🧠 Registrace Service-Workera -->
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js")
                .then(() => console.log("🧠 SW registrován"))
                .catch(err => console.error("SW chyba:", err));
        }
    </script>
</head>

<body>
    <!-- 🧭 Horní lišta -->
    <header id="appHeader" class="app-header">
        <h1 id="appTitle">
            🌌 Chytré já
        </h1>

        <div class="header-controls">
            <label for="modelSelector">Model:</label>
            <select id="modelSelector">
                <option value="dlouhovekost">Dlouhověkost</option>
                <option value="toc">TOC</option>
            </select>

            <label for="roleSelect">Režim:</label>
            <select id="roleSelect">
                <option value="demo">Demo</option>
                <option value="free">Free</option>
                <option value="pro">Pro</option>
                <option value="user">User</option>
            </select>
        </div>

    </header>

    <!-- 🌌 Plátno sítě -->
    <div id="network"></div>

    <!-- === 🌌 Postranní panel === -->
    <aside id="sidePanel">
        <div class="panel-header">
            <h2 id="nodeTitle"><i class="fa-solid fa-circle-nodes"></i> Uzlový název</h2>
            <button class="panel-close" id="closePanel">✖</button>
        </div>

        <div class="panel-content">
            <p class="definition" id="nodeDef"></p>

            <hr>
            <h3>💬 Myšlenky</h3>
            <ul id="nodeThoughts"></ul>

            <hr>
            <h3>📘 Dokumenty</h3>
            <ul id="nodeDocs"></ul>

            <hr>
            <h3>🎬 Média</h3>
            <ul id="nodeMedia"></ul>

            <hr>
            <h3>🧩 Úlohy</h3>
            <ul id="nodeTasks"></ul>

            <!-- === 🧠 Chytré já – sekce v panelu === -->
            <hr class="ai-divider">
            <h3 class="ai-section-title"><i class="fa-solid fa-brain"></i> Chytré já</h3>
            <div id="aiPanelSection">
                <input id="aiPanelInput" type="text" placeholder="Zeptej se Chytrého já…" />
                <button id="aiPanelSend"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- === 🧠 Rozbalený chat === -->
        <div id="aiChatOverlay" class="hidden">
            <div class="ai-chat-header">
                <h2><i class="fa-solid fa-brain"></i> Chytré já</h2>
                <button id="aiChatClose">✖</button>
            </div>
            <div id="aiChatMessages"></div>
            <div class="ai-chat-input">
                <input id="aiChatInput" type="text" placeholder="Zeptej se..." />
                <button id="aiChatSend"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </aside>

    <!-- === 📄 Overlay pro dokumenty (MD/PDF) === -->
    <div id="docOverlay">
        <div id="docViewer">
            <button id="closeDoc" title="Zavřít">✖</button>
            <iframe id="docFrame" src=""></iframe>
        </div>
    </div>

    <!-- 🤖 Logika Chytrého já -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            /* === 🧠 Chytré já – základní prvky === */
            const panelInput = document.getElementById("aiPanelInput");
            const panelSend = document.getElementById("aiPanelSend");
            const chatOverlay = document.getElementById("aiChatOverlay");
            const chatMessages = document.getElementById("aiChatMessages");
            const chatInput = document.getElementById("aiChatInput");
            const chatSend = document.getElementById("aiChatSend");
            const chatClose = document.getElementById("aiChatClose");

            /* === 💬 Pomocné funkce === */
            const appendMsg = (text, who = "ai") => {
                const div = document.createElement("div");
                div.className = `msg ${who}`;
                div.textContent = text;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };

            const aiReply = (text) => {
                const q = text.toLowerCase();
                if (q.includes("spánek")) return "Spánek je základ – 7–8 hodin a tma.";
                if (q.includes("výroba")) return "Najdi úzké místo a zesil tok. ⚙️";
                if (q.includes("ahoj")) return "Ahoj 👋, jsem Chytré já. Jak ti mohu pomoct?";
                return "Zajímavé, pověz mi víc… 🤔";
            };

            /* === 🚀 Rozbalení chatu === */
            const openChat = (text) => {
                if (!text) return;

                // 🎬 Zobraz overlay přes celý panel
                chatOverlay.classList.add("visible");
                chatOverlay.style.opacity = "1";
                chatOverlay.style.pointerEvents = "all";
                chatOverlay.style.transform = "translateY(0)";

                // 🧹 Vyčisti a přidej zprávy
                chatMessages.innerHTML = "";
                appendMsg(text, "user");
                panelInput.value = "";
                setTimeout(() => appendMsg(aiReply(text), "ai"), 600);

                console.log("🧠 Chytré já rozbaleno.");
            };

            /* === ❎ Zavření chatu === */
            chatClose.addEventListener("click", () => {
                chatOverlay.classList.remove("visible");
                chatOverlay.style.opacity = "0";
                chatOverlay.style.pointerEvents = "none";
                chatOverlay.style.transform = "translateY(20px)";
                console.log("❎ Chytré já skryto.");
            });

            /* === 📩 Odeslání dotazu ze sekce dole === */
            panelSend.addEventListener("click", () => {
                openChat(panelInput.value.trim());
            });

            panelInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") openChat(panelInput.value.trim());
            });

            /* === 💬 Odeslání přímo z rozbaleného chatu === */
            const sendChatMsg = () => {
                const text = chatInput.value.trim();
                if (!text) return;
                appendMsg(text, "user");
                chatInput.value = "";
                setTimeout(() => appendMsg(aiReply(text), "ai"), 600);
            };

            chatSend.addEventListener("click", sendChatMsg);
            chatInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") sendChatMsg();
            });

            console.log("✅ Chytré já inicializováno.");
        });
    </script>
    <!-- === 🧠 PLovoucí Chytré Já === -->
    <div id="floatingAiHelper" class="ai-helper mini hidden">
        <div class="aih-header">
            <span>🧠 Chytré já</span>
            <button id="aihClose">✖</button>
        </div>

        <div class="aih-mini">
            <div class="aih-mini-title">🧠 Chytré já</div>
            <div class="aih-mini-input">
                <input id="aihMiniInput" type="text" placeholder="Zeptej se…" />
                <button id="aihMiniMic"><i class="fa-solid fa-microphone"></i></button>
            </div>
        </div>

        <div class="aih-body">
            <div id="aihMessages" class="aih-window"></div>
            <div class="aih-input">
                <button id="aihMic"><i class="fa-solid fa-microphone"></i></button>
                <input id="aihInput" type="text" placeholder="Zeptej se na cokoliv…" />
                <button id="aihSend"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const helper = document.getElementById("floatingAiHelper");
            const header = helper.querySelector(".aih-header");
            const messages = document.getElementById("aihMessages");
            const input = document.getElementById("aihInput");
            const sendBtn = document.getElementById("aihSend");
            const micBtn = document.getElementById("aihMic");
            const miniInput = document.getElementById("aihMiniInput");
            const miniMic = document.getElementById("aihMiniMic");
            const closeBtn = document.getElementById("aihClose");

            // === Přidání zprávy ===
            const appendMsg = (text, who = "ai") => {
                const div = document.createElement("div");
                div.className = `aih-msg ${who}`;
                div.textContent = text;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
            };

            // === Odpověď AI ===
            const aiReply = (text) => {
                const q = text.toLowerCase();
                if (q.includes("spánek")) return "Spánek je základ – 7–8 hodin a tma.";
                if (q.includes("výroba")) return "Najdi úzké místo a zesil tok. ⚙️";
                if (q.includes("ahoj")) return "Ahoj 👋, jsem Chytré já. Jak ti mohu pomoci?";
                return "Zajímavé, pověz mi víc… 🤔";
            };

            // === Odeslání ===
            const send = (text) => {
                if (!text.trim()) return;
                appendMsg(text, "user");
                input.value = "";
                setTimeout(() => appendMsg(aiReply(text), "ai"), 500);
            };

            sendBtn.addEventListener("click", () => send(input.value));
            input.addEventListener("keydown", (e) => e.key === "Enter" && send(input.value));

            // === Mini režim ===
            miniInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    helper.classList.remove("mini");
                    helper.classList.add("expanded");
                    send(miniInput.value);
                    miniInput.value = "";
                }
            });

            // === Zavření ===
            closeBtn.addEventListener("click", () => {
                helper.classList.add("hidden");
                helper.classList.remove("expanded");
                helper.classList.add("mini");
            });

            // === Přepínání mezi mini/expanded ===
            header.addEventListener("click", () => {
                helper.classList.toggle("expanded");
                helper.classList.toggle("mini");
            });

            // === Otevření z kódu ===
            window.openAiChat = () => {
                helper.classList.remove("hidden");
                helper.classList.add("mini");
            };

            console.log("✅ Plovoucí Chytré já inicializováno.");
        });
    </script>
    <!-- 🔥 Universe moduly – MUSÍ být v tomto pořadí -->
    <script type="module" src="../assets/js/universe-viewers.js"></script>
    <script type="module" src="../assets/js/universe-access.js"></script>
    <script type="module" src="../assets/js/universe-panel.js"></script>
    <script type="module" src="../assets/js/universe-core.js"></script>
    <script type="module" src="../assets/js/universe-init.js"></script>
</body>

</html>
