<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Viewer</title>

    <style>
        body {
            background: #0f172a;
            margin: 0;
            font-family: system-ui, sans-serif;
            color: #e2e8f0;
        }

        /* ====== HORNÍ LIŠTA ====== */
        #topbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 52px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 15px;
            gap: 15px;
            z-index: 100;
            border-bottom: 1px solid #1e293b;
        }

        .btn {
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #38bdf8;
            font-size: 0.9rem;
            border: 1px solid #334155;
            transition: 0.15s;
        }

        .btn:hover {
            background: #334155;
        }

        /* ===== Content ====== */
        #wrapper {
            max-width: 900px;
            margin: 70px auto 30px auto;
            /* 70px = místo pro topbar */
            padding: 20px;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 80px);
            border: none;
            border-radius: 10px;
            background: #1e293b;
        }

        /* Markdown styling */
        .md-content {
            line-height: 1.7;
            font-size: 1.05rem;
        }

        h1,
        h2,
        h3,
        h4 {
            color: #f1f5f9;
            margin-top: 1.4em;
            margin-bottom: 0.4em;
        }

        a {
            color: #38bdf8;
        }

        blockquote {
            border-left: 4px solid #38bdf8;
            padding-left: 12px;
            color: #94a3b8;
            margin-left: 0;
        }

        img,
        video,
        audio {
            max-width: 100%;
            border-radius: 10px;
            margin: 12px 0;
        }
    </style>
</head>

<body>

    <!-- ===== TOP BAR ===== -->
    <div id="topbar">
        <div class="btn" id="btnBack">← Zpět</div>
        <div class="btn" id="btnPrint">🖨️ Tisk</div>
        <div class="btn" id="btnDownload">⬇️ Stáhnout</div>
    </div>

    <!-- ===== CONTENT ===== -->
    <div id="wrapper">
        <div id="content">Načítám…</div>
    </div>

    <script type="module">
        import { convertMarkdownToHtml } from "../assets/js/universe-viewers.js";

        const params = new URLSearchParams(window.location.search);
        const file = params.get("file");
        const type = params.get("type");
        const content = document.getElementById("content");

        if (!file) {
            content.innerHTML = "<p>⚠️ Chyba: Soubor nebyl zadán.</p>";
        }

        // === ZPĚT DO VESMÍRU ===
        document.getElementById("btnBack").onclick = () => {
            window.close(); // zavře tab
        };

        // === TISK ===
        document.getElementById("btnPrint").onclick = () => {
            window.print();
        };

        // === STÁHNOUT ===
        document.getElementById("btnDownload").onclick = () => {
            const a = document.createElement("a");
            a.href = file;
            a.download = file.split("/").pop();
            a.click();
        };

        // === PDF ===
        if (type === "pdf") {
            content.innerHTML = `<iframe src="${file}"></iframe>`;
        }

        // === Markdown ===
        else if (type === "md") {
            fetch(file)
                .then(res => res.text())
                .then(md => {
                    content.innerHTML = `<div class="md-content">${convertMarkdownToHtml(md)}</div>`;
                })
                .catch(err => {
                    content.innerHTML = `<p>❌ Nelze načíst markdown: ${err}</p>`;
                });
        }

        // === Video ===
        else if (type === "video") {
            content.innerHTML = `
                <video controls>
                    <source src="${file}">
                </video>`;
        }

        // === Audio ===
        else if (type === "audio") {
            content.innerHTML = `
                <audio controls>
                    <source src="${file}">
                </audio>`;
        }

        // === Obrázek ===
        else if (type === "image") {
            content.innerHTML = `<img src="${file}">`;
        }
    </script>

</body>

</html>
