<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>

    <link rel="stylesheet" href="./assets/css/viewer.css">

    <!-- Marked – ESM verze -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/marked/marked.esm.js"></script>
</head>

<body>

    <div id="topbar">
        <div class="btn" id="btnBack">← Zpět</div>
        <div class="btn" id="btnPrint">🖨️ Tisk</div>
        <div class="btn" id="btnDownload">⬇️ Stáhnout</div>
    </div>

    <div id="wrapper">
        <div id="content">Načítám…</div>
    </div>

    <script type="module">
        import { convertMarkdownToHtml } from "./assets/js/universe-viewers.js";

        const params = new URLSearchParams(window.location.search);
        const type = params.get("type");
        let file = params.get("file");

        if (!file.startsWith("/")) {
            file = "/" + file;
        }

        fetch(file)


        const content = document.getElementById("content");

        document.getElementById("btnBack").onclick = () => window.close();
        document.getElementById("btnPrint").onclick = () => window.print();

        document.getElementById("btnDownload").onclick = () => {
            const a = document.createElement("a");
            a.href = file;
            a.download = file.split("/").pop();
            a.click();
        };

        // === PDF ===
        if (type === "pdf") {
            content.innerHTML = `<iframe src="/public/${file}"></iframe>`;
        }

        // === AUDIO ===
        else if (type === "audio") {
            content.innerHTML = `
            <audio controls style="width:100%">
                <source src="/public/${file}">
            </audio>`;
        }

        // === IMAGE ===
        else if (type === "image") {
            content.innerHTML = `<img src="/public/${file}" style="max-width:100%;border-radius:12px;">`;
        }

        // === VIDEO ===
        else if (type === "video") {
            const embed = file.replace("watch?v=", "embed/");
            content.innerHTML = `
            <iframe width="100%" height="520"
                src="${embed}"
                frameborder="0"
                allowfullscreen></iframe>`;
        }

        // === MARKDOWN (article) ===
        else if (type === "article" || type === "md") {

            // MD jsou vždy ve složce /public/clanky/
            const mdPath = `/public/${file}`;

            fetch(mdPath)
                .then(r => {
                    if (!r.ok) throw new Error("Soubor nenalezen: " + mdPath);
                    return r.text();
                })
                .then(md => {
                    content.innerHTML =
                        `<div class="md-content">${convertMarkdownToHtml(md)}</div>`;
                })
                .catch(err => {
                    content.innerHTML =
                        `<p style="color:#f88">Nepodařilo se načíst článek.<br>${err}</p>`;
                });
        }
    </script>

</body>

</html>
