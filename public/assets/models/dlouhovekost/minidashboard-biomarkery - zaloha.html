<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dlouhověkost – Biomarkery</title>
    <style>
        :root {
            --bg: #0f172a;
            --ink: #e2e8f0;
            --muted: #94a3b8;
            --card: #1e293b;
            --accent: #93c5fd;
            --sub: #a5b4fc;
            --wrap: 1400px;
            --gap: 1.25rem;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Inter", system-ui, sans-serif;
            padding: 2.2rem 1rem 3rem;
        }

        .page {
            max-width: var(--wrap);
            margin: 0 auto
        }

        /* Nadpis – bez záře a méně tučný */
        h2 {
            margin: 0 0 .9rem 0;
            text-align: center;
            color: var(--accent);
            font-weight: 700;
            font-size: 1.85rem;
            letter-spacing: .02em;
        }

        /* Souhrn */
        .summary-count {
            text-align: center;
            color: var(--ink);
            font-size: 1.02rem;
            margin-bottom: 1.2rem;
        }

        /* Vitality box */
        .vitality-box {
            background: var(--card);
            border-radius: .8rem;
            padding: 1.1rem 1.3rem;
            max-width: 700px;
            margin: 0 auto 2.2rem;
        }

        .vitality-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600
        }

        .vitality-bar {
            position: relative;
            height: 14px;
            border-radius: 999px;
            background: #475569;
            overflow: hidden;
            margin-top: .45rem
        }

        #vitalityFill {
            position: absolute;
            inset: 0 100% 0 0;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            transition: inset 2s ease
        }

        .vitality-text {
            text-align: center;
            margin-top: .7rem;
            color: var(--muted);
            font-size: .95rem
        }

        /* Sekce */
        .section {
            max-width: var(--wrap);
            margin: 2.2rem auto 0
        }

        .section__head {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: var(--gap);
            align-items: end;
            margin-bottom: .5rem
        }

        .section__title {
            grid-column: 1/2;
            display: flex;
            align-items: center;
            gap: .5rem;
            color: var(--sub);
            font-weight: 700;
            font-size: 1.25rem
        }

        .section__title .emoji {
            font-size: 1.35rem
        }

        /* Grid 4 karet */
        .mini-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: var(--gap);
            max-width: var(--wrap);
            margin: 0 auto
        }

        @media (max-width:1200px) {
            .mini-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr))
            }
        }

        @media (max-width:900px) {
            .mini-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }
        }

        @media (max-width:560px) {
            .mini-grid {
                grid-template-columns: 1fr
            }
        }

        /* Karta */
        .mini-card {
            background: var(--card);
            border-radius: .8rem;
            padding: 1rem 1rem 1.05rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .45)
        }

        .mini-title {
            font-size: .95rem;
            color: #cbd5e1;
            margin: 0 0 .3rem 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .mini-trend {
            width: 100%;
            height: 55px;
            margin: .25rem 0 .5rem 0;
            display: block
        }

        .mini-value {
            font-size: 1.55rem;
            font-weight: 700;
            color: #f1f5f9;
            margin: .15rem 0 .3rem 0
        }

        .mini-status {
            font-size: .95rem;
            display: flex;
            align-items: center;
            gap: .45rem
        }

        .mini-status .dot {
            width: .62rem;
            height: .62rem;
            border-radius: 999px;
            display: inline-block
        }

        .mini-range {
            font-size: .82rem;
            color: var(--muted);
            margin-top: .1rem
        }

        .mini-comment {
            font-size: .85rem;
            color: #cbd5e1;
            margin-top: .45rem;
            line-height: 1.35
        }

        #backToUniverse {
            display: block;
            margin: 2.3rem auto 0;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .95rem;
        }
    </style>
</head>

<body>
    <div class="page">
        <h2>🧬 Dlouhověkost – Biomarkery</h2>
        <div class="summary-count" id="summaryCount">Načítám…</div>

        <div class="vitality-box">
            <div class="vitality-header">
                <span>📊 Vitality Score</span>
                <span id="vitalityValue">0 %</span>
            </div>
            <div class="vitality-bar">
                <div id="vitalityFill"></div>
            </div>
            <div class="vitality-text" id="vitalityText">–</div>
        </div>
    </div>

    <button id="backToUniverse">⬅️ Zpět do vesmíru</button>

    <script>
        const DATA_URL = "./longevity-biomarkers.json";

        // české čárky
        const cz = v => (typeof v === "number" ? ("" + v).replace(".", ",") : (v ?? "").toString().replace(/\./g, ","));

        // jediné vizuální značení stavu = BAREVNÁ TEČKA + čistý text (bez emoji)
        function statusVisual(text = "") {
            const s = (text || "").toLowerCase();
            if (s.includes("optim") || s.includes("v norm")) return { color: "#22c55e", label: cleanStatus(text) };
            if (s.includes("mírně") || s.includes("lehce")) return { color: "#f59e0b", label: cleanStatus(text) };
            if (s.includes("zvýš") || s.includes("vysok") || s.includes("mimo")) return { color: "#ef4444", label: cleanStatus(text) };
            return { color: "#94a3b8", label: cleanStatus(text) };
        }
        // odstraní vedoucí emoji/symboly
        function cleanStatus(t = "") {
            return (t || "").replace(/^[^\p{L}\p{N}]+/u, "").trim();
        }

        function drawMiniTrend(ctx, data, color) {
            if (!ctx || !data || data.length < 2) return;
            const c = ctx.canvas, w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio || 1;
            c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            const mx = 15, my = 10, min = Math.min(...data), max = Math.max(...data), rng = Math.max(1e-6, max - min);
            const pts = data.map((v, i) => ({ x: mx + (i / (data.length - 1)) * (w - mx * 2), y: h - ((v - min) / rng) * (h - my * 2) - my }));

            ctx.beginPath(); ctx.lineWidth = 9; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = (color || "#22d3ee") + "e0";
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length - 2; i++) { const xc = (pts[i].x + pts[i + 1].x) / 2, yc = (pts[i].y + pts[i + 1].y) / 2; ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc); }
            const last = pts.at(-1), pre = pts.at(-2), endX = pre.x + (last.x - pre.x) * 0.9, endY = pre.y + (last.y - pre.y) * 0.9;
            ctx.quadraticCurveTo(pre.x, pre.y, endX, endY); ctx.stroke();

            ctx.beginPath(); ctx.moveTo(endX + 6, endY); ctx.lineTo(Math.min(w - 8, endX + 240), endY);
            ctx.lineWidth = 9; ctx.lineCap = "round"; ctx.strokeStyle = "#94a3b877"; ctx.stroke();

            ctx.beginPath(); ctx.arc(endX, endY, 10, 0, Math.PI * 2);
            ctx.fillStyle = color || "#22d3ee"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.stroke();
        }

        function cardHTML(b) {
            const vis = statusVisual(b.status || "");
            const value = b.value != null ? `${cz(b.value)} ${b.unit || ""}`.trim() : "—";
            const range = b.range ? `Rozmezí: ${cz(b.range)}` : "";
            const comment = b.comment || b.desc || b.interpretation || "";
            return `
        <div class="mini-card">
          <div class="mini-title">${b.label || b.name || b.id || "—"}</div>
          <canvas class="mini-trend"></canvas>
          <div class="mini-value">${value}</div>
          <div class="mini-status"><span class="dot" style="background:${vis.color}"></span><span>${vis.label || "—"}</span></div>
          <div class="mini-range">${range}</div>
          <div class="mini-comment">${comment}</div>
        </div>
      `;
        }

        function renderSection(root, group) {
            const sec = document.createElement("section");
            sec.className = "section";
            sec.innerHTML = `
        <div class="section__head">
          <div class="section__title"><span class="emoji">${group.icon || ""}</span>${group.label || group.id}</div>
        </div>
        <div class="mini-grid" id="grid-${group.id}"></div>
      `;
            root.appendChild(sec);

            const grid = sec.querySelector(`#grid-${group.id}`);
            (group.biomarkers || []).forEach(b => {
                const host = document.createElement("div");
                host.innerHTML = cardHTML(b);
                grid.appendChild(host.firstElementChild);
                const ctx = grid.lastElementChild.querySelector("canvas").getContext("2d");
                drawMiniTrend(ctx, (b.trend || []).map(Number), b.color);
            });
        }

        function updateVitalityScore(groups) {
            const all = groups.flatMap(g => g.biomarkers || []);
            const total = all.length;
            let good = 0, warn = 0, bad = 0;
            all.forEach(m => {
                const s = (m.status || "").toLowerCase();
                if (s.includes("optim") || s.includes("v norm")) good++;
                else if (s.includes("mírně") || s.includes("lehce")) warn++;
                else if (s.includes("zvýš") || s.includes("vysok") || s.includes("mimo")) bad++;
            });
            document.getElementById("summaryCount").innerHTML =
                `<b>Celkem:</b> ${total} • <span style="color:#22c55e">V normě:</span> ${good} • <span style="color:#f59e0b">Ke sledování:</span> ${warn} • <span style="color:#ef4444">Mimo:</span> ${bad}`;

            const vitality = Math.round((good / Math.max(1, total)) * 100);
            const fill = document.getElementById("vitalityFill");
            const val = document.getElementById("vitalityValue");
            const txt = document.getElementById("vitalityText");

            // animace – měníme pravý inset
            requestAnimationFrame(() => { fill.style.inset = `0 ${100 - vitality}% 0 0`; });
            val.textContent = vitality + " %";
            txt.textContent = vitality > 80 ? "Výborný stav – tělo je v optimální rovnováze."
                : vitality > 60 ? "Stabilní stav – drobné výkyvy vyžadují pozornost."
                    : "Zhoršený stav – zlepši spánek, stres a výživu.";
        }

        async function loadData() {
            try {
                const r = await fetch(DATA_URL);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const j = await r.json();
                const groups = Array.isArray(j) ? j : (j.groups || []);
                if (!groups.length) throw new Error("Prázdná data.");

                updateVitalityScore(groups);
                const host = document.querySelector(".page");
                groups.forEach(g => renderSection(host, g));
            } catch (e) { console.error("❌ Nelze načíst data:", e); }
        }

        document.getElementById("backToUniverse").onclick = () => {
            if (window.opener) window.close();
            else if (window.parent && window.parent !== window) window.parent.postMessage("showUniverse", "*");
            else window.location.href = "./index.html";
        };

        window.addEventListener("load", loadData);
    </script>
</body>

</html>
