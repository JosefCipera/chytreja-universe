<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./assets/css/medioteka.css">

</head>

<body class="medioteka-body">

    <div class="medioteka-container">

    <div class="medioteka-back">

            <span id="modalClose" class="medioteka-modal-close">&times;</span>
            <div id="modalInner"></div>
