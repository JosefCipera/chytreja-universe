<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biomarkery dlouhověkosti</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --muted: #94a3b8;
            --text: #e2e8f0;
            --accent: #dbeafe;
            --ok: #22c55e;
            --warn: #f59e0b;
            --bad: #ef4444;
            --grid-max: 1500px;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
        }

        .wrap {
            max-width: var(--grid-max);
            margin: 32px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            margin: 0 0 6px;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 0 14px rgba(147, 197, 253, .35);
        }

        .summary {
            text-align: center;
            font-size: 1.05rem;
            color: #cbd5e1;
            margin-bottom: 28px;
        }

        .summary span.score {
            color: var(--ok);
            font-weight: 700;
        }

        /* --- Sekce --- */
        .subttl {
            margin: 28px 0 16px;
            color: var(--accent);
            font-weight: 700;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subttl span.icon {
            font-size: 1.6rem;
            line-height: 1;
        }

        /* --- GRID: přesně 4 karty na řádek --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            justify-items: center;
            align-items: start;
            margin-bottom: 40px;
        }

        @media (max-width: 1400px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* --- KARTY --- */
        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 14px 16px 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 250px;
            height: 250px;
            /* čtvercový vzhled */
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .5);
        }

        .title {
            font-size: .95rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .value {
            font-size: 1.7rem;
            font-weight: 700;
            margin: 2px 0 6px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
            font-size: .9rem;
            margin: 1px 0;
        }

        .row small {
            color: var(--muted);
        }

        .status-ok {
            color: var(--ok);
        }

        .status-warn {
            color: var(--warn);
        }

        .status-bad {
            color: var(--bad);
        }

        /* --- Trend --- */
        .trend {
            width: 100%;
            height: 52px;
            margin: 4px 0 10px;
            border-radius: 10px;
        }

        .details {
            color: #cbd5e1;
            font-size: .85rem;
            line-height: 1.35;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>🧬 Biomarkery dlouhověkosti</h1>
        <div id="summary" class="summary"></div>
        <div id="groups"></div>
    </div>

    <script>
        const DATA_URL = "./longevity-biomarkers.json";

        const ic = { ok: "✅", warn: "⚠️", bad: "❌" };
        const statusClass = s => {
            const t = (s || "").toLowerCase();
            if (t.includes("optim") || t.includes("v norm")) return "status-ok";
            if (t.includes("mírně") || t.includes("hrani")) return "status-warn";
            if (t.includes("nad") || t.includes("pod") || t.includes("vysok") || t.includes("nízk")) return "status-bad";
            return "status-ok";
        };
        const statusIcon = s => {
            const t = (s || "").toLowerCase();
            if (t.includes("optim") || t.includes("v norm")) return ic.ok;
            if (t.includes("mírně") || t.includes("hrani")) return ic.warn;
            if (t.includes("nad") || t.includes("pod") || t.includes("vysok") || t.includes("nízk")) return ic.bad;
            return ic.ok;
        };
        const fmt = (v, u) => `${String(v).replace(/\./g, ",")} ${u || ""}`.trim();

        function drawTrend(c, arr, col = "#60a5fa") {
            const ctx = c.getContext("2d"), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
            c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
            if (!Array.isArray(arr) || arr.length < 2) return;
            const min = Math.min(...arr), max = Math.max(...arr), r = max - min || 1e-6, mX = 14, mY = 8;
            const pts = arr.map((v, i) => ({ x: mX + (i / (arr.length - 1)) * (w - mX * 2), y: h - ((v - min) / r) * (h - mY * 2) - mY }));
            ctx.beginPath(); ctx.lineWidth = 7; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = col + "e0";
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length - 2; i++) {
                const xc = (pts[i].x + pts[i + 1].x) / 2, yc = (pts[i].y + pts[i + 1].y) / 2;
                ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
            }
            const p = pts[pts.length - 2], l = pts[pts.length - 1];
            const ex = p.x + (l.x - p.x) * .94, ey = p.y + (l.y - p.y) * .94;
            ctx.quadraticCurveTo(p.x, p.y, ex, ey); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(ex + 6, ey); ctx.lineTo(Math.min(ex + 180, w - mX), ey);
            ctx.lineWidth = 7; ctx.strokeStyle = "#94a3b877"; ctx.stroke();
            ctx.beginPath(); ctx.arc(ex, ey, 9, 0, Math.PI * 2);
            ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2.3; ctx.strokeStyle = "#fff"; ctx.stroke();
        }

        function cardHTML(b) {
            const c = statusClass(b.status), i = statusIcon(b.status);
            return `<div class="card">
        <div class="title">${b.label || "—"}</div>
        <canvas class="trend"></canvas>
        <div class="value">${fmt(b.value, b.unit)}</div>
        <div class="row ${c}"><span>${i}</span><span>${b.status || "—"}</span></div>
        <div class="row"><small>Rozmezí:</small><small>${b.range || "—"}</small></div>
        ${b.comment ? `<div class="details">${b.comment}</div>` : ""}
      </div>`;
        }

        function render(groups) {
            const host = document.getElementById("groups");
            host.innerHTML = "";
            let total = 0, ok = 0;
            groups.forEach(g => {
                const sec = document.createElement("section");
                sec.innerHTML = `<div class="subttl"><span class="icon">${g.icon || ""}</span>${g.label || g.id}</div>
          <div class="grid">${(g.biomarkers || []).map(cardHTML).join("")}</div>`;
                host.appendChild(sec);
                const cvs = sec.querySelectorAll("canvas.trend");
                (g.biomarkers || []).forEach((b, i) => {
                    drawTrend(cvs[i], b.trend?.map(Number) || [], b.color || "#60a5fa");
                    total++;
                    if (statusClass(b.status) === "status-ok") ok++;
                });
            });
            const score = Math.round((ok / total) * 100);
            document.getElementById("summary").innerHTML =
                `${total} ukazatelů | ${ok} v normě | <span class="score">Skóre: ${score}%</span>`;
        }

        async function load() {
            try {
                const r = await fetch(DATA_URL);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const j = await r.json();
                render(j.groups || []);
            } catch (e) {
                console.error("❌ Nelze načíst data:", e);
                document.getElementById("groups").innerHTML =
                    `<p style="color:#fca5a5">Nelze načíst data biomarkerů: ${e.message}</p>`;
            }
        }
        window.addEventListener("load", load);
    </script>
</body>

</html>
